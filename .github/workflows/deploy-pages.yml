name: Deploy myFlix to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check production entry point
        run: |
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            const html = readFileSync("dist/index.html", "utf8");
            if (html.includes("/src/") || !html.includes("./assets/")) {
              throw new Error("Pages must serve compiled assets");
            }
            for (const match of html.matchAll(/(?:src|href)="(\.\/assets\/[^"]+)"/g)) {
              if (!existsSync("dist/" + match[1])) throw new Error("Missing asset: " + match[1]);
            }
          '
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy compiled app
        id: deployment
        uses: actions/deploy-pages@v4
